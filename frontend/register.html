<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Ro'yxatdan o'tish - UstaBor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>UstaBor</a>
  </header>

  <main class="container">
    <form id="form" class="card auth-card" novalidate>
      <div class="auth-icon-badge"><span class="material-symbols-outlined" aria-hidden="true">person_add</span></div>
      <h1>Ro'yxatdan o'tish</h1>
      <p id="step-hint" class="muted">Yangi akkaunt yarating</p>

      <div id="details-step">
        <label id="role-label">Men</label>
        <div class="segmented" role="radiogroup" aria-labelledby="role-label">
          <label>
            <input type="radio" name="role" value="customer" checked />
            <span><span class="material-symbols-outlined icon-sm" aria-hidden="true">person</span>Mijoz</span>
          </label>
          <label>
            <input type="radio" name="role" value="master" />
            <span><span class="material-symbols-outlined icon-sm" aria-hidden="true">engineering</span>Usta</span>
          </label>
        </div>

        <label for="full_name">Ism va familiya</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name"
               minlength="2" maxlength="120" required />

        <label for="phone">Telefon raqami</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
               placeholder="+998 90 123 45 67" required />

        <label for="password">Parol (kamida 8 ta belgi, harf va raqam)</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" minlength="8" maxlength="72" required />
      </div>

      <div id="otp-step" style="display:none;">
        <p class="muted" id="otp-phone-note"></p>
        <label for="otp_code">SMS orqali yuborilgan kod</label>
        <input id="otp_code" name="otp_code" type="text" inputmode="numeric"
               autocomplete="one-time-code" minlength="6" maxlength="6"
               pattern="\d{6}" placeholder="______" />
        <p class="auth-switch" style="margin-top:8px;">
          <a href="#" id="back-link"><span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>Telefon raqamini o'zgartirish</a>
          ·
          <a href="#" id="resend-link">Kodni qayta yuborish</a>
        </p>
      </div>

      <div id="error" class="form-error" role="alert"></div>

      <button id="submit" class="btn btn-block" type="submit">Kod yuborish</button>

      <p class="auth-switch">Akkauntingiz bormi? <a href="login.html">Kirish</a></p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    if (getToken() && getUser()) {
      window.location.replace(homeFor(getUser()));
    }

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const errorEl = document.getElementById("error");
    const stepHintEl = document.getElementById("step-hint");
    const detailsStepEl = document.getElementById("details-step");
    const otpStepEl = document.getElementById("otp-step");
    const otpPhoneNoteEl = document.getElementById("otp-phone-note");
    const otpInput = document.getElementById("otp_code");
    const backLink = document.getElementById("back-link");
    const resendLink = document.getElementById("resend-link");

    let step = "details"; // "details" | "otp"
    let pendingPayload = null;

    function readDetailsPayload() {
      return {
        role: form.role.value,
        full_name: form.full_name.value.trim(),
        phone: form.phone.value.trim(),
        password: form.password.value,
      };
    }

    function validateDetails(payload) {
      if (payload.full_name.length < 2) {
        return "Ism kamida 2 ta belgidan iborat bo'lishi kerak";
      }
      if (!payload.phone) {
        return "Telefon raqamini kiriting";
      }
      if (payload.password.length < 8) {
        return "Parol kamida 8 ta belgidan iborat bo'lishi kerak";
      }
      if (!/[a-zA-Z]/.test(payload.password) || !/\d/.test(payload.password)) {
        return "Parolda kamida bitta harf va bitta raqam bo'lishi kerak";
      }
      return null;
    }

    function showOtpStep() {
      step = "otp";
      detailsStepEl.style.display = "none";
      otpStepEl.style.display = "block";
      stepHintEl.textContent = "Telefoningizga yuborilgan kodni kiriting";
      otpPhoneNoteEl.textContent = pendingPayload.phone + " raqamiga tasdiqlash kodi yuborildi";
      submit.textContent = "Tasdiqlash";
      otpInput.value = "";
      otpInput.focus();
    }

    function showDetailsStep() {
      step = "details";
      detailsStepEl.style.display = "block";
      otpStepEl.style.display = "none";
      stepHintEl.textContent = "Yangi akkaunt yarating";
      submit.textContent = "Kod yuborish";
      errorEl.textContent = "";
    }

    backLink.addEventListener("click", (e) => {
      e.preventDefault();
      showDetailsStep();
    });

    resendLink.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!pendingPayload) return;
      errorEl.textContent = "";
      try {
        await apiFetch("/auth/register/request-otp", {
          method: "POST",
          body: JSON.stringify({ phone: pendingPayload.phone }),
        });
        toast("Kod qayta yuborildi", "success");
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";

      if (step === "details") {
        const payload = readDetailsPayload();
        const validationError = validateDetails(payload);
        if (validationError) {
          errorEl.textContent = validationError;
          return;
        }
        submit.disabled = true;
        submit.textContent = "Yuborilmoqda...";
        try {
          await apiFetch("/auth/register/request-otp", {
            method: "POST",
            body: JSON.stringify({ phone: payload.phone }),
          });
          pendingPayload = payload;
          showOtpStep();
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submit.disabled = false;
        }
        return;
      }

      // step === "otp"
      const code = otpInput.value.trim();
      if (!/^\d{6}$/.test(code)) {
        errorEl.textContent = "Kod 6 ta raqamdan iborat bo'lishi kerak";
        return;
      }
      submit.disabled = true;
      submit.textContent = "Tasdiqlanmoqda...";
      try {
        const data = await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({ ...pendingPayload, otp_code: code }),
        });
        saveSession(data.access_token, data.user);
        if (data.user.role === "customer") requestAndCacheLocation();
        window.location.replace(homeFor(data.user));
      } catch (err) {
        errorEl.textContent = err.message;
        submit.disabled = false;
        submit.textContent = "Tasdiqlash";
      }
    });
  </script>
</body>
</html>
