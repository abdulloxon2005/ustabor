<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>UstaBor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <span class="brand">UstaBor</span>
    <a id="header-btn" class="btn btn-outline" href="login.html">Kirish</a>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Uyga usta chaqiring</h1>
      <p class="muted">Xizmat tanlang, buyurtma bering, usta toping.</p>
      <a id="hero-btn" class="btn btn-accent" href="#categories">Buyurtma berish</a>
    </section>

    <p id="status" class="muted">Server tekshirilmoqda...</p>

    <h2 id="categories">Xizmatlar</h2>
    <p id="cat-state" class="muted">Yuklanmoqda...</p>
    <div class="grid" id="cat-grid"></div>
  </main>

  <nav class="bottom-nav">
    <a class="active" href="index.html"><span class="icon">🏠</span>Asosiy</a>
    <a id="nav-orders" href="my-orders.html"><span class="icon">📋</span>Buyurtmalar</a>
    <a id="nav-profile" href="login.html"><span class="icon">👤</span>Profil</a>
  </nav>

  <script src="js/api.js"></script>
  <script>
    // Foydalanuvchi kirganmi?
    const curUser = getUser();
    const headerBtn = document.getElementById("header-btn");
    const heroBtn = document.getElementById("hero-btn");

    if (curUser && getToken()) {
      headerBtn.textContent = "Chiqish";
      headerBtn.href = "#";
      headerBtn.addEventListener("click", (e) => { e.preventDefault(); logout(); });
      if (curUser.role === "customer") {
        heroBtn.href = "create-order.html";
      }
    }

    // Server holati
    const el = document.getElementById("status");
    apiFetch("/health")
      .then((d) => {
        el.textContent = "Server ishlayapti: " + d.status;
        el.className = "ok";
      })
      .catch((e) => {
        el.textContent = "Serverga ulanib bo'lmadi: " + e.message;
        el.className = "err";
      });

    // Kategoriyalar
    const catState = document.getElementById("cat-state");
    const catGrid = document.getElementById("cat-grid");
    apiFetch("/categories")
      .then((list) => {
        if (!list.length) {
          catState.textContent = "Hozircha xizmatlar yo'q";
          return;
        }
        catState.hidden = true;
        list.forEach((c) => {
          const a = document.createElement("a");
          a.className = "card category-card";
          // Kirgan customer buyurtma sahifasiga, aks holda ustalar ro'yxatiga
          if (curUser && curUser.role === "customer" && getToken()) {
            a.href = "create-order.html?category_id=" + encodeURIComponent(c.id);
          } else {
            a.href = "masters.html?category_id=" + encodeURIComponent(c.id);
          }
          a.textContent = c.name;
          catGrid.appendChild(a);
        });
      })
      .catch((e) => {
        catState.textContent = "Xizmatlarni yuklab bo'lmadi: " + e.message;
        catState.className = "err";
      });
  </script>
</body>
</html>
