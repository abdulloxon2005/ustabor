<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Buyurtma tafsilotlari - SmartUsta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>SmartUsta</a>
    <a class="btn btn-outline" href="my-orders.html"><span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>Orqaga</a>
  </header>

  <main class="container">
    <h1 id="pageTitle">Buyurtma tafsilotlari</h1>
    <p id="state" class="muted" aria-live="polite">Yuklanmoqda...</p>
    <div id="retryBox" style="display: none; margin-bottom: 12px;">
      <button id="retryBtn" class="btn btn-outline" type="button">Qayta urinish</button>
    </div>

    <div id="notFoundBox" class="card empty-state" style="display: none;">
      <p id="notFoundMsg" class="err" style="font-weight: 600; margin: 0 0 12px;">Buyurtma topilmadi</p>
      <a class="btn btn-outline" href="my-orders.html">Buyurtmalarimga qaytish</a>
    </div>

    <div id="content" style="display: none;">
      <!-- Asosiy kartochka -->
      <div class="card">
        <div class="card-row">
          <strong id="catName" style="font-size: 1.15rem;"></strong>
          <span id="statusBadge" class="badge"></span>
        </div>

        <p id="desc" style="margin: 12px 0 8px;"></p>

        <p class="muted" style="margin: 4px 0;">
          <strong>Manzil:</strong> <span id="addressText"></span>
        </p>
        <p id="orderMapLinkWrap" style="margin: 4px 0; display: none;"></p>

        <p class="muted" style="margin: 4px 0;">
          <strong>Yaratilgan vaqti:</strong> <span id="createdText"></span>
        </p>

        <p class="muted" style="margin: 4px 0;">
          <strong>Biriktirilgan usta:</strong> <span id="masterName"></span>
        </p>

        <div id="orderNoteBox" style="display: none; margin-top: 10px;"></div>

        <!-- Rasmlar -->
        <div id="photosSection" style="margin-top: 12px;"></div>

        <!-- Narx bloki -->
        <div id="priceSection" style="margin-top: 12px;"></div>

        <!-- Bekor qilish tugmasi -->
        <button id="cancelBtn" class="btn btn-danger btn-block" type="button" style="display: none; margin-top: 16px;">
          Bekor qilish
        </button>
      </div>

      <!-- Chat -->
      <div id="chatCard" class="card" style="display: none;"></div>

      <!-- Shikoyat -->
      <div id="disputeCard" class="card" style="display: none;"></div>

      <!-- Holat tarixi (Timeline) -->
      <div class="card">
        <h2 style="margin-top: 0;">Holat tarixi</h2>
        <div id="timelineList" class="timeline"></div>
      </div>

      <!-- Sharh bloki -->
      <div id="reviewSection"></div>
    </div>
  </main>

  <!-- Baholash modali: ish yakunlangach avtomatik ochiladi -->
  <div id="reviewModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
      <div class="card-row" style="margin-bottom: 8px;">
        <h2 id="reviewModalTitle" style="margin: 0; font-size: 1.15rem;">Ish yakunlandi!</h2>
        <button id="reviewModalCloseBtn" class="btn btn-outline" type="button" aria-label="Yopish">Yopish</button>
      </div>
      <div id="reviewModalBody"></div>
    </div>
  </div>

  <nav class="bottom-nav"></nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const user = requireAuth(["customer"]);
      if (!user) return;

      renderNav("orders");

      const params = new URLSearchParams(window.location.search);
      const rawId = params.get("id");
      const orderId = rawId && /^\d+$/.test(rawId) ? rawId : null;

      const stateEl = document.getElementById("state");
      const retryBoxEl = document.getElementById("retryBox");
      const retryBtnEl = document.getElementById("retryBtn");
      const notFoundBoxEl = document.getElementById("notFoundBox");
      const notFoundMsgEl = document.getElementById("notFoundMsg");
      const contentEl = document.getElementById("content");

      retryBtnEl.addEventListener("click", () => loadOrder());
      const catNameEl = document.getElementById("catName");
      const statusBadgeEl = document.getElementById("statusBadge");
      const descEl = document.getElementById("desc");
      const addressTextEl = document.getElementById("addressText");
      const orderMapLinkWrapEl = document.getElementById("orderMapLinkWrap");
      const createdTextEl = document.getElementById("createdText");
      const masterNameEl = document.getElementById("masterName");
      const priceSectionEl = document.getElementById("priceSection");
      const photosSectionEl = document.getElementById("photosSection");
      const chatCardEl = document.getElementById("chatCard");
      let chatWidget = null;
      const disputeCardEl = document.getElementById("disputeCard");
      let disputeWidget = null;
      const DISPUTE_ALLOWED_STATUSES = new Set(["assigned", "in_progress", "completed", "cancelled"]);
      const cancelBtn = document.getElementById("cancelBtn");
      const timelineListEl = document.getElementById("timelineList");
      const reviewSectionEl = document.getElementById("reviewSection");
      const reviewModalEl = document.getElementById("reviewModal");
      const reviewModalBodyEl = document.getElementById("reviewModalBody");
      const reviewModalCloseBtn = document.getElementById("reviewModalCloseBtn");
      let reviewModalAutoShown = false;

      function openReviewModal() {
        reviewModalEl.style.display = "flex";
      }
      function closeReviewModal() {
        reviewModalEl.style.display = "none";
      }
      reviewModalCloseBtn.addEventListener("click", closeReviewModal);
      reviewModalEl.addEventListener("click", (e) => {
        if (e.target === reviewModalEl) closeReviewModal();
      });

      const CANCELLABLE = new Set(["searching", "assigned"]);
      const MAX_ORDER_PHOTOS = 5;

      function renderPhotos(order) {
        photosSectionEl.replaceChildren();

        const title = document.createElement("div");
        title.style.fontWeight = "600";
        title.style.marginBottom = "8px";
        title.textContent = "Rasmlar";
        photosSectionEl.appendChild(title);

        const photos = order.photos || [];
        if (photos.length) {
          const grid = document.createElement("div");
          grid.style.display = "grid";
          grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(84px, 1fr))";
          grid.style.gap = "8px";
          photos.forEach((url) => {
            const a = document.createElement("a");
            a.href = API_BASE.replace("/api/v1", "") + url;
            a.target = "_blank";
            a.rel = "noopener";
            const img = document.createElement("img");
            img.src = API_BASE.replace("/api/v1", "") + url;
            img.alt = "Buyurtma rasmi";
            img.style.width = "100%";
            img.style.height = "84px";
            img.style.objectFit = "cover";
            img.style.borderRadius = "10px";
            img.style.border = "1px solid var(--border)";
            a.appendChild(img);
            grid.appendChild(a);
          });
          photosSectionEl.appendChild(grid);
        } else {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.style.margin = "0";
          empty.textContent = "Rasm yo'q";
          photosSectionEl.appendChild(empty);
        }

        if (user.role === "customer" && photos.length < MAX_ORDER_PHOTOS) {
          const label = document.createElement("label");
          label.style.margin = "10px 0 4px";
          label.style.fontSize = "0.85rem";
          label.textContent = "Rasm qo'shish";
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/jpeg,image/png";
          input.multiple = true;
          input.addEventListener("change", async () => {
            if (!input.files.length) return;
            const fd = new FormData();
            for (const f of input.files) fd.append("files", f);
            input.disabled = true;
            try {
              await apiFetch("/orders/" + order.id + "/photos", { method: "POST", body: fd });
              toast("Rasm yuklandi", "success");
              loadOrder();
            } catch (err) {
              toast(err.message, "error");
              input.disabled = false;
            }
          });
          photosSectionEl.append(label, input);
        }
      }

      function renderTimeline(history) {
        timelineListEl.replaceChildren();
        if (!history || !history.length) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "Tarix mavjud emas";
          timelineListEl.appendChild(empty);
          return;
        }
        history.forEach((h) => {
          const item = document.createElement("div");
          item.className = "timeline-item";

          const dot = document.createElement("div");
          dot.className = "timeline-dot";

          const label = document.createElement("div");
          label.style.fontWeight = "600";
          label.textContent = formatOrderStatus(h.to_status);

          const time = document.createElement("div");
          time.className = "muted";
          time.style.fontSize = "0.85rem";
          time.textContent = formatDate(h.created_at);

          item.append(dot, label, time);
          timelineListEl.appendChild(item);
        });
      }

      function renderPriceBlock(order) {
        priceSectionEl.replaceChildren();

        if (order.agreed_price != null) {
          const box = document.createElement("div");
          box.style.padding = "8px 0";

          const label = document.createElement("span");
          label.className = "muted";
          label.textContent = "Kelishilgan narx: ";

          const val = document.createElement("strong");
          val.style.fontSize = "1.1rem";
          val.style.color = "var(--primary)";
          val.textContent = formatSom(order.agreed_price);

          box.append(label, val);
          priceSectionEl.appendChild(box);
          return;
        }

        const quotes = order.quotes || [];
        const proposedQuote = quotes.slice().reverse().find((q) => q.status === "proposed");
        if (proposedQuote && order.status === "assigned") {
          const qBox = document.createElement("div");
          qBox.className = "quote-box";

          const qTitle = document.createElement("div");
          qTitle.style.fontWeight = "600";
          qTitle.style.color = "#1e40af";
          qTitle.textContent = "Usta narx taklifi:";

          const qPrice = document.createElement("div");
          qPrice.style.fontSize = "1.2rem";
          qPrice.style.fontWeight = "700";
          qPrice.style.margin = "4px 0";
          qPrice.textContent = formatSom(proposedQuote.price);

          qBox.append(qTitle, qPrice);

          if (proposedQuote.note) {
            const qNote = document.createElement("div");
            qNote.className = "muted";
            qNote.style.fontSize = "0.9rem";
            qNote.textContent = "Izoh: " + proposedQuote.note;
            qBox.appendChild(qNote);
          }

          const btnRow = document.createElement("div");
          btnRow.style.display = "flex";
          btnRow.style.gap = "8px";
          btnRow.style.marginTop = "10px";

          const acceptBtn = document.createElement("button");
          acceptBtn.type = "button";
          acceptBtn.className = "btn btn-accent";
          acceptBtn.style.flex = "1";
          acceptBtn.textContent = "Tasdiqlash";

          const rejectBtn = document.createElement("button");
          rejectBtn.type = "button";
          rejectBtn.className = "btn btn-outline";
          rejectBtn.style.flex = "1";
          rejectBtn.textContent = "Rad etish";

          acceptBtn.addEventListener("click", async () => {
            if (!(await confirmModal("Narx taklifini tasdiqlaysizmi: " + formatSom(proposedQuote.price) + "?"))) return;
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;
            acceptBtn.textContent = "Tasdiqlanmoqda...";
            try {
              await apiFetch("/orders/" + order.id + "/quotes/" + proposedQuote.id + "/accept", {
                method: "POST",
              });
              loadOrder();
            } catch (err) {
              toast(err.message, "error");
              acceptBtn.disabled = false;
              rejectBtn.disabled = false;
              acceptBtn.textContent = "Tasdiqlash";
            }
          });

          rejectBtn.addEventListener("click", async () => {
            if (!(await confirmModal("Narx taklifini rad etishni xohlaysizmi?"))) return;
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;
            rejectBtn.textContent = "Rad etilmoqda...";
            try {
              await apiFetch("/orders/" + order.id + "/quotes/" + proposedQuote.id + "/reject", {
                method: "POST",
              });
              loadOrder();
            } catch (err) {
              toast(err.message, "error");
              acceptBtn.disabled = false;
              rejectBtn.disabled = false;
              rejectBtn.textContent = "Rad etish";
            }
          });

          btnRow.append(acceptBtn, rejectBtn);
          qBox.appendChild(btnRow);
          priceSectionEl.appendChild(qBox);
        }
      }

      function buildReviewForm(order) {
        const form = document.createElement("form");
        form.className = "card";
        form.noValidate = true;

        const title = document.createElement("h2");
        title.style.marginTop = "0";
        title.textContent = "Xizmat haqida sharh qoldiring";

        // minValue=1: umumiy baho (doim tanlangan); minValue=0: ixtiyoriy sub-baho
        function makeStarPicker(initial, minValue) {
          const container = document.createElement("div");
          container.className = "star-rating";
          container.setAttribute("role", "radiogroup");

          let value = initial;
          const starEls = [];

          function update(val) {
            value = val;
            starEls.forEach((s, idx) => {
              const isSelected = idx < val;
              s.classList.toggle("active", isSelected);
              s.setAttribute("aria-pressed", String(idx + 1 === val));
            });
          }

          for (let i = 1; i <= 5; i++) {
            const s = document.createElement("button");
            s.type = "button";
            s.appendChild(createIcon("star", "icon-filled"));
            s.setAttribute("aria-label", i + " yulduz");
            s.addEventListener("click", () => update(i));
            starEls.push(s);
            container.appendChild(s);
          }
          update(initial);

          return { container, getValue: () => (value === 0 ? null : value) };
        }

        const starPicker = makeStarPicker(5, 1);
        const starContainer = starPicker.container;

        const subPickersWrap = document.createElement("div");
        subPickersWrap.style.margin = "12px 0";
        subPickersWrap.style.display = "grid";
        subPickersWrap.style.gap = "8px";

        const subPickerDefs = [
          ["quality_rating", "Sifat (ixtiyoriy)"],
          ["timeliness_rating", "Vaqtida kelish (ixtiyoriy)"],
          ["price_rating", "Narx adolati (ixtiyoriy)"],
        ];
        const subPickers = {};
        subPickerDefs.forEach(([key, labelText]) => {
          const row = document.createElement("div");
          const lbl = document.createElement("div");
          lbl.className = "muted";
          lbl.style.fontSize = "0.85rem";
          lbl.style.marginBottom = "2px";
          lbl.textContent = labelText;
          const picker = makeStarPicker(0, 0);
          row.append(lbl, picker.container);
          subPickersWrap.appendChild(row);
          subPickers[key] = picker;
        });

        const label = document.createElement("label");
        label.setAttribute("for", "commentInput");
        label.textContent = "Sharh (ixtiyoriy):";

        const textarea = document.createElement("textarea");
        textarea.id = "commentInput";
        textarea.placeholder = "Usta ishi, sifati va muomalasi haqida fikringiz...";
        textarea.maxLength = 1000;

        const errEl = document.createElement("div");
        errEl.className = "form-error";
        errEl.setAttribute("role", "alert");

        const submitBtn = document.createElement("button");
        submitBtn.type = "submit";
        submitBtn.className = "btn btn-block btn-accent";
        submitBtn.style.marginTop = "12px";
        submitBtn.textContent = "Sharh yuborish";

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errEl.textContent = "";
          submitBtn.disabled = true;
          submitBtn.textContent = "Yuborilmoqda...";

          try {
            await apiFetch("/orders/" + order.id + "/review", {
              method: "POST",
              body: JSON.stringify({
                rating: starPicker.getValue(),
                comment: textarea.value.trim() || null,
                quality_rating: subPickers.quality_rating.getValue(),
                timeliness_rating: subPickers.timeliness_rating.getValue(),
                price_rating: subPickers.price_rating.getValue(),
              }),
            });
            closeReviewModal();
            loadOrder();
          } catch (err) {
            errEl.textContent = err.message;
            submitBtn.disabled = false;
            submitBtn.textContent = "Sharh yuborish";
          }
        });

        form.append(title, starContainer, subPickersWrap, label, textarea, errEl, submitBtn);
        return form;
      }

      function renderReviewBlock(order) {
        reviewSectionEl.replaceChildren();

        if (order.review) {
          closeReviewModal();
          const card = document.createElement("div");
          card.className = "card review-box";

          const head = document.createElement("div");
          head.className = "card-row";

          const title = document.createElement("strong");
          title.style.color = "var(--ok)";
          title.style.fontSize = "1.05rem";
          title.textContent = "Sizning sharhingiz";

          const dateSpan = document.createElement("span");
          dateSpan.className = "muted";
          dateSpan.textContent = formatDate(order.review.created_at);

          head.append(title, dateSpan);

          const ratingRow = document.createElement("div");
          ratingRow.className = "rating";
          ratingRow.style.margin = "6px 0";
          ratingRow.append(
            createIcon("star", "icon-filled icon-sm"),
            document.createTextNode(order.review.rating + " / 5")
          );

          card.append(head, ratingRow);

          if (order.review.comment) {
            const comm = document.createElement("p");
            comm.style.margin = "4px 0 0";
            comm.textContent = order.review.comment;
            card.appendChild(comm);
          }

          const subLabels = [
            ["quality_rating", "Sifat"],
            ["timeliness_rating", "Vaqtida kelish"],
            ["price_rating", "Narx adolati"],
          ];
          const subEntries = subLabels.filter(([key]) => order.review[key] != null);
          if (subEntries.length) {
            const subRow = document.createElement("div");
            subRow.className = "muted";
            subRow.style.marginTop = "6px";
            subRow.style.fontSize = "0.85rem";
            subRow.style.display = "flex";
            subRow.style.flexWrap = "wrap";
            subRow.style.alignItems = "center";
            subRow.style.gap = "6px";
            subEntries.forEach(([key, label], idx) => {
              if (idx > 0) subRow.appendChild(document.createTextNode("·"));
              const itemSpan = document.createElement("span");
              itemSpan.style.display = "inline-flex";
              itemSpan.style.alignItems = "center";
              itemSpan.style.gap = "2px";
              const starIcon = createIcon("star", "icon-filled icon-sm");
              starIcon.style.color = "#f59e0b";
              itemSpan.append(
                document.createTextNode(label + ": "),
                starIcon,
                document.createTextNode(String(order.review[key]))
              );
              subRow.appendChild(itemSpan);
            });
            card.appendChild(subRow);
          }

          reviewSectionEl.appendChild(card);
          return;
        }

        if (order.can_review) {
          // Forma modal ichiga joylanadi (ish yakunlanganda avtomatik ochiladi);
          // sahifada esa kichik eslatma + uni qayta ochish tugmasi qoladi.
          reviewModalBodyEl.replaceChildren(buildReviewForm(order));

          const prompt = document.createElement("div");
          prompt.className = "card";
          prompt.style.textAlign = "center";
          const promptText = document.createElement("p");
          promptText.style.margin = "0 0 10px";
          promptText.style.fontWeight = "600";
          promptText.textContent = "Ish yakunlandi — ustani baholang";
          const promptBtn = document.createElement("button");
          promptBtn.type = "button";
          promptBtn.className = "btn btn-accent btn-block";
          promptBtn.textContent = "Ustani baholash";
          promptBtn.addEventListener("click", openReviewModal);
          prompt.append(promptText, promptBtn);
          reviewSectionEl.appendChild(prompt);

          if (!reviewModalAutoShown) {
            reviewModalAutoShown = true;
            openReviewModal();
          }
        } else {
          closeReviewModal();
        }
      }

      async function loadOrder(silent) {
        if (!silent) {
          retryBoxEl.style.display = "none";
          notFoundBoxEl.style.display = "none";
          contentEl.style.display = "none";
        }

        if (!orderId) {
          stateEl.textContent = "";
          notFoundMsgEl.textContent = "Buyurtma topilmadi";
          notFoundBoxEl.style.display = "block";
          return;
        }

        if (!silent) {
          retryBtnEl.disabled = true;
          stateEl.textContent = "Yuklanmoqda...";
          stateEl.className = "muted";
        }

        try {
          const order = await apiFetch("/orders/" + orderId);
          retryBtnEl.disabled = false;
          stateEl.textContent = "";
          contentEl.style.display = "block";

          catNameEl.textContent = order.category_name;
          statusBadgeEl.className = "badge badge-" + order.status;
          statusBadgeEl.textContent = formatOrderStatus(order.status);

          descEl.textContent = order.description;
          addressTextEl.textContent = order.city + ", " + order.district + ", " + order.address;
          orderMapLinkWrapEl.replaceChildren();
          const orderMapLinkEl = mapLink(order.latitude, order.longitude);
          if (orderMapLinkEl) {
            orderMapLinkWrapEl.appendChild(orderMapLinkEl);
            orderMapLinkWrapEl.style.display = "block";
          } else {
            orderMapLinkWrapEl.style.display = "none";
          }
          createdTextEl.textContent = formatDate(order.created_at);
          masterNameEl.textContent = order.master_name || "Biriktirilmagan";

          const orderNoteBox = document.getElementById("orderNoteBox");
          if (order.selection_mode === "automatic" && order.status === "searching") {
            orderNoteBox.className = "status-banner pending";
            orderNoteBox.style.display = "block";
            orderNoteBox.textContent = "Qidirilmoqda...";
            try {
              const dispatch = await apiFetch("/orders/" + order.id + "/dispatch-status");
              let text = dispatch.message;
              if (dispatch.dispatch_radius_km < 999) {
                text += " (radius: " + dispatch.dispatch_radius_km + " km)";
              }
              if (dispatch.rejected_offers || dispatch.expired_offers) {
                text += " · rad etilgan: " + dispatch.rejected_offers + ", javobsiz: " + dispatch.expired_offers;
              }
              orderNoteBox.textContent = text;
            } catch (e) {
              orderNoteBox.textContent = order.note || "Usta qidiruvi davom etmoqda";
            }
          } else if (order.note) {
            orderNoteBox.className = "status-banner pending";
            orderNoteBox.style.display = "block";
            orderNoteBox.textContent = order.note;
          } else {
            orderNoteBox.style.display = "none";
          }

          renderPhotos(order);

          if (order.master_id) {
            chatCardEl.style.display = "block";
            if (chatWidget) {
              chatWidget.reload();
            } else {
              chatWidget = createChatWidget(order.id, user.id);
              chatCardEl.replaceChildren(chatWidget.el);
            }
          } else {
            chatCardEl.style.display = "none";
          }

          if (DISPUTE_ALLOWED_STATUSES.has(order.status)) {
            disputeCardEl.style.display = "block";
            if (disputeWidget) {
              disputeWidget.reload();
            } else {
              disputeWidget = createDisputeWidget(order.id);
              disputeCardEl.replaceChildren(disputeWidget.el);
            }
          } else {
            disputeCardEl.style.display = "none";
          }

          renderPriceBlock(order);
          renderTimeline(order.history);
          renderReviewBlock(order);

          if (CANCELLABLE.has(order.status)) {
            cancelBtn.style.display = "block";
            cancelBtn.disabled = false;
            cancelBtn.textContent = "Bekor qilish";
            cancelBtn.onclick = async () => {
              if (!(await confirmModal("Buyurtmani bekor qilishni xohlaysizmi?"))) return;
              cancelBtn.disabled = true;
              cancelBtn.textContent = "Bekor qilinmoqda...";
              try {
                await apiFetch("/orders/" + order.id + "/cancel", { method: "POST" });
                loadOrder();
              } catch (err) {
                toast(err.message, "error");
                cancelBtn.disabled = false;
                cancelBtn.textContent = "Bekor qilish";
              }
            };
          } else {
            cancelBtn.style.display = "none";
          }
        } catch (err) {
          if (silent) return; // fon rejimida xatolikni jim o'tkazib yuboramiz
          retryBtnEl.disabled = false;
          if (err.status === 403) {
            renderForbidden(err.message);
            return;
          }
          if (err.status === 404) {
            stateEl.textContent = "";
            notFoundMsgEl.textContent = "Buyurtma topilmadi";
            notFoundBoxEl.style.display = "block";
            return;
          }
          stateEl.textContent = "Xatolik: " + (err.message || "Buyurtma topilmadi");
          stateEl.className = "err";
          retryBoxEl.style.display = "block";
        }
      }

      loadOrder();
      startPolling(() => loadOrder(true), 15000);
    })();
  </script>
</body>
</html>
