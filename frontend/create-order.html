<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Buyurtma berish - SmartUsta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>SmartUsta</a>
    <a class="btn btn-outline" href="my-orders.html">Buyurtmalarim</a>
  </header>

  <main class="container">
    <h1>Yangi buyurtma</h1>

    <div id="masterBanner" class="card" style="display:none; background: var(--bg); border-color: var(--primary);"></div>

    <form id="form" class="card" novalidate>
      <label for="category">Xizmat turi</label>
      <select id="category" name="category_id" required>
        <option value="">Yuklanmoqda...</option>
      </select>

      <label for="description">Tavsif (kamida 5 ta belgi)</label>
      <textarea id="description" name="description" minlength="5" maxlength="2000"
                placeholder="Muammoni batafsil tavsiflang" required></textarea>

      <label for="city">Shahar</label>
      <input id="city" name="city" type="text" autocomplete="address-level2"
             placeholder="Toshkent" maxlength="80" required />

      <label for="district">Tuman</label>
      <input id="district" name="district" type="text" autocomplete="address-level3"
             placeholder="Chilonzor" maxlength="80" required />

      <label for="address">Manzil</label>
      <input id="address" name="address" type="text" autocomplete="street-address"
             maxlength="255" placeholder="Ko'cha, uy raqami" required />

      <label>Xaritada belgilash (ixtiyoriy)</label>
      <div id="mapContainer"></div>

      <label for="photos">Rasm (ixtiyoriy, muammoni ko'rsatish uchun, 5 tagacha)</label>
      <input id="photos" name="photos" type="file" accept="image/jpeg,image/png" multiple />

      <div id="modeField">
        <label id="mode-label">Usta tanlash usuli</label>
        <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
          <label>
            <input type="radio" name="selection_mode" value="manual" checked />
            <span>O'zim tanlayman</span>
          </label>
          <label>
            <input type="radio" name="selection_mode" value="automatic" />
            <span>Tizim tanlasin</span>
          </label>
        </div>
      </div>

      <div id="error" class="form-error" role="alert"></div>
      <div id="catRetryBox" style="display:none; margin-bottom:12px;">
        <button id="catRetryBtn" class="btn btn-outline" type="button">Qayta urinish</button>
      </div>
      <button id="submit" class="btn btn-block btn-accent" type="submit">Buyurtma berish</button>
    </form>
  </main>

  <nav class="bottom-nav"></nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const user = requireAuth(["customer"]);
      if (!user) return;

      renderNav("orders");

      const form = document.getElementById("form");
      const submit = document.getElementById("submit");
      const errorEl = document.getElementById("error");
      const catRetryBox = document.getElementById("catRetryBox");
      const catRetryBtn = document.getElementById("catRetryBtn");
      const catSelect = document.getElementById("category");
      const masterBanner = document.getElementById("masterBanner");
      const modeField = document.getElementById("modeField");
      const cityInput = document.getElementById("city");
      const districtInput = document.getElementById("district");
      const addressInput = document.getElementById("address");

      const urlParams = new URLSearchParams(window.location.search);
      const preselect = urlParams.get("category_id");
      const masterId = urlParams.get("master_id");
      let targetMaster = null;

      // Manzil maydonlari bo'sh bo'lsagina (foydalanuvchi qo'lda kiritgan matnni
      // bosib yubormaslik uchun) joriy/qidirilgan joylashuv bo'yicha avtomatik to'ldiradi.
      async function reverseGeocodeFill(lat, lon) {
        if (masterId || cityInput.readOnly) return; // usta oldindan tanlangan: shahar qulflangan
        if (cityInput.value.trim() && districtInput.value.trim() && addressInput.value.trim()) return;
        try {
          const results = await apiFetch(
            "/geo/search?q=" + encodeURIComponent(lon + "," + lat)
          );
          if (!results.length) return;
          const clean = (s) => (s || "").replace(/\s+(tumani|shahri|viloyati|rayoni)$/i, "").trim();
          const parts = results[0].address.split(",").map((p) => p.trim());
          if (!cityInput.value.trim() && parts[1]) cityInput.value = clean(parts[1]);
          if (!districtInput.value.trim() && parts[2]) districtInput.value = clean(parts[2]);
          if (!addressInput.value.trim() && parts.length > 3) {
            addressInput.value = parts.slice(3).join(", ");
          }
        } catch (e) {
          // jim o'tkazib yuboriladi: manzilni qo'lda kiritish imkoniyati qoladi
        }
      }

      const mapPicker = createMapPicker({
        autoLocate: !masterId,
        onChange: (lat, lon, source) => {
          if (source !== "init" && source !== "drag") reverseGeocodeFill(lat, lon);
        },
      });
      document.getElementById("mapContainer").appendChild(mapPicker.el);

      function fillCategorySelect(options, emptyText) {
        catSelect.replaceChildren();
        if (!options.length) {
          const o = document.createElement("option");
          o.value = "";
          o.textContent = emptyText;
          catSelect.appendChild(o);
          return;
        }
        catSelect.disabled = false;
        options.forEach((c) => {
          const o = document.createElement("option");
          o.value = c.id;
          o.textContent = c.name;
          if (preselect && String(c.id) === preselect) o.selected = true;
          catSelect.appendChild(o);
        });
      }

      function loadCategories() {
        catRetryBox.style.display = "none";
        catRetryBtn.disabled = true;
        catSelect.disabled = true;
        errorEl.textContent = "";
        catSelect.replaceChildren();
        const loadingOpt = document.createElement("option");
        loadingOpt.value = "";
        loadingOpt.textContent = "Yuklanmoqda...";
        catSelect.appendChild(loadingOpt);

        const request = masterId
          ? apiFetch("/masters/" + masterId).then((master) => {
              targetMaster = master;
              return master.services.map((s) => ({ id: s.category_id, name: s.category_name }));
            })
          : apiFetch("/categories");

        request
          .then((list) => {
            catRetryBtn.disabled = false;
            fillCategorySelect(list, masterId ? "Bu usta hech qanday xizmat ko'rsatmaydi" : "Hozircha xizmatlar yo'q");

            if (masterId && targetMaster) {
              masterBanner.style.display = "block";
              masterBanner.replaceChildren();
              const title = document.createElement("strong");
              title.textContent = "Siz " + targetMaster.full_name + " ustasiga buyurtma berasiz";
              const sub = document.createElement("p");
              sub.className = "muted";
              sub.style.margin = "4px 0 0";
              sub.textContent = targetMaster.city + ", " + targetMaster.district;
              const cancelLink = document.createElement("a");
              cancelLink.href = "create-order.html" + (preselect ? "?category_id=" + encodeURIComponent(preselect) : "");
              cancelLink.textContent = "Bekor qilish";
              cancelLink.style.display = "inline-block";
              cancelLink.style.marginTop = "8px";
              masterBanner.append(title, sub, cancelLink);

              cityInput.value = targetMaster.city;
              cityInput.readOnly = true;
              cityInput.style.background = "var(--bg)";
              modeField.style.display = "none";
            }
          })
          .catch((e) => {
            catRetryBtn.disabled = false;
            if (e.status === 403) {
              renderForbidden(e.message);
              return;
            }
            catSelect.replaceChildren();
            const o = document.createElement("option");
            o.value = "";
            o.textContent = "Yuklashda xatolik";
            catSelect.appendChild(o);
            errorEl.textContent = "Xizmatlarni yuklashda xatolik: " + e.message;
            catRetryBox.style.display = "block";
          });
      }

      catRetryBtn.addEventListener("click", () => loadCategories());
      loadCategories();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";

        const payload = {
          category_id: Number(catSelect.value),
          description: form.description.value.trim(),
          city: form.city.value.trim(),
          district: form.district.value.trim(),
          address: form.address.value.trim(),
          selection_mode: masterId ? "manual" : form.selection_mode.value,
        };

        const coords = mapPicker.getCoords();
        if (coords) {
          payload.latitude = coords[0];
          payload.longitude = coords[1];
        }

        if (!payload.category_id) { errorEl.textContent = "Xizmat turini tanlang"; return; }
        if (payload.description.length < 5) { errorEl.textContent = "Tavsif kamida 5 ta belgidan iborat bo'lishi kerak"; return; }
        if (!payload.city) { errorEl.textContent = "Shaharni kiriting"; return; }
        if (!payload.district) { errorEl.textContent = "Tumanni kiriting"; return; }
        if (!payload.address) { errorEl.textContent = "Manzilni kiriting"; return; }

        const photoFiles = form.photos.files;
        if (photoFiles.length > 5) {
          errorEl.textContent = "Ko'pi bilan 5 ta rasm yuklash mumkin";
          return;
        }

        submit.disabled = true;
        submit.textContent = "Yuborilmoqda...";
        try {
          const res = await apiFetch("/orders", { method: "POST", body: JSON.stringify(payload) });

          if (photoFiles.length) {
            const fd = new FormData();
            for (const f of photoFiles) fd.append("files", f);
            try {
              await apiFetch("/orders/" + res.id + "/photos", { method: "POST", body: fd });
            } catch (photoErr) {
              // Buyurtma allaqachon yaratilgan: rasm xatosi butun oqimni to'xtatmaydi
              toast("Buyurtma yaratildi, lekin rasm yuklanmadi: " + photoErr.message, "error");
            }
          }

          if (masterId) {
            try {
              await apiFetch("/orders/" + res.id + "/select-master", {
                method: "POST",
                body: JSON.stringify({ master_id: Number(masterId) }),
              });
              window.location.replace("order-detail.html?id=" + res.id);
            } catch (selErr) {
              toast("Buyurtma yaratildi, lekin ustani biriktirishda xatolik: " + selErr.message, "error");
              const q = new URLSearchParams({
                category_id: payload.category_id,
                city: payload.city,
                district: payload.district,
                order_id: res.id,
              });
              window.location.replace("masters.html?" + q.toString());
            }
          } else if (payload.selection_mode === "manual") {
            const q = new URLSearchParams({
              category_id: payload.category_id,
              city: payload.city,
              district: payload.district,
              order_id: res.id,
            });
            if (payload.latitude != null) {
              q.set("lat", payload.latitude);
              q.set("lon", payload.longitude);
            }
            window.location.replace("masters.html?" + q.toString());
          } else {
            if (res.note) {
              sessionStorage.setItem("order_note", res.note);
            }
            window.location.replace("my-orders.html");
          }
        } catch (err) {
          if (err.status === 403) {
            renderForbidden(err.message);
            return;
          }
          errorEl.textContent = err.message;
          submit.disabled = false;
          submit.textContent = "Buyurtma berish";
        }
      });
    })();
  </script>
</body>
</html>
