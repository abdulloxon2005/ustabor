<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Ustalar - UstaBor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">UstaBor</a>
    <a class="btn btn-outline" href="index.html">Orqaga</a>
  </header>

  <main class="container">
    <h1 id="title">Ustalar</h1>

    <form id="filters" class="master-filters" novalidate>
      <div>
        <label for="q">Usta ismi</label>
        <input id="q" name="q" type="text" placeholder="Ism bo'yicha qidirish" />
      </div>
      <div>
        <label for="categorySelect">Xizmat turi</label>
        <select id="categorySelect" name="category_id">
          <option value="">Barcha xizmatlar</option>
        </select>
      </div>
      <div>
        <label for="city">Shahar</label>
        <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Toshkent" />
      </div>
      <div>
        <label for="district">Tuman</label>
        <input id="district" name="district" type="text" autocomplete="address-level3" placeholder="Chilonzor" />
      </div>
      <button id="searchBtn" class="btn" type="submit">Qidirish</button>
    </form>

    <label id="favOnlyLabel" style="display:none; align-items:center; gap:8px; margin:4px 0 12px; font-weight:400;">
      <input id="favOnly" type="checkbox" style="width:20px; height:20px; min-height:0; margin:0;" />
      Faqat sevimlilar
    </label>

    <p id="state" class="muted" aria-live="polite"></p>
    <div id="retry-box" style="display:none; margin-bottom:12px;">
      <button id="retry-btn" class="btn btn-outline" type="button">Qayta urinish</button>
    </div>
    <div id="list"></div>
  </main>

  <nav class="bottom-nav"></nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav("masters");

    const params = new URLSearchParams(window.location.search);
    const rawCat = params.get("category_id");
    let categoryId = rawCat && /^\d+$/.test(rawCat) ? rawCat : null;
    const rawOrderId = params.get("order_id");
    const orderId = rawOrderId && /^\d+$/.test(rawOrderId) ? rawOrderId : null;
    const rawLat = params.get("lat");
    const rawLon = params.get("lon");
    const orderLat = rawLat && !isNaN(parseFloat(rawLat)) ? parseFloat(rawLat) : null;
    const orderLon = rawLon && !isNaN(parseFloat(rawLon)) ? parseFloat(rawLon) : null;
    const user = getToken() ? getUser() : null;

    const form = document.getElementById("filters");
    const searchBtn = document.getElementById("searchBtn");
    const stateEl = document.getElementById("state");
    const retryBoxEl = document.getElementById("retry-box");
    const retryBtnEl = document.getElementById("retry-btn");
    const listEl = document.getElementById("list");
    const favOnlyLabel = document.getElementById("favOnlyLabel");
    const favOnly = document.getElementById("favOnly");
    const categorySelect = document.getElementById("categorySelect");
    form.city.value = params.get("city") || "";
    form.district.value = params.get("district") || "";
    form.q.value = params.get("q") || "";

    const isCustomer = Boolean(user && user.role === "customer");
    let favoriteIds = new Set();
    let nearbyDistanceById = new Map();

    async function loadNearbyDistances() {
      nearbyDistanceById = new Map();
      if (orderLat == null || orderLon == null || !isCustomer) return;
      try {
        const nearby = await apiFetch(
          "/masters/nearby?latitude=" + orderLat + "&longitude=" + orderLon + "&radius_km=500"
        );
        nearby.forEach((n) => nearbyDistanceById.set(n.id, n.distance_km));
      } catch (e) {
        // jim o'tkazib yuboriladi: masofa shunchaki ko'rsatilmaydi
      }
    }

    if (isCustomer) {
      favOnlyLabel.style.display = "flex";
      favOnly.addEventListener("change", () => load());
    }

    async function loadFavoriteIds() {
      if (!isCustomer) return;
      try {
        const favs = await apiFetch("/masters/favorites");
        favoriteIds = new Set(favs.map((m) => m.id));
      } catch (e) {
        // jim o'tkazib yuboriladi: yurak belgisi shunchaki bo'sh ko'rinadi
      }
    }

    async function toggleFavorite(masterId, btn) {
      const isFav = favoriteIds.has(masterId);
      btn.disabled = true;
      try {
        if (isFav) {
          await apiFetch("/masters/" + masterId + "/favorite", { method: "DELETE" });
          favoriteIds.delete(masterId);
        } else {
          await apiFetch("/masters/" + masterId + "/favorite", { method: "POST" });
          favoriteIds.add(masterId);
        }
        btn.textContent = favoriteIds.has(masterId) ? "♥" : "♡";
        btn.setAttribute("aria-label", favoriteIds.has(masterId) ? "Sevimlilardan olib tashlash" : "Sevimlilarga qo'shish");
      } catch (e) {
        toast(e.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    retryBtnEl.addEventListener("click", () => load());

    function setState(text, isError) {
      stateEl.textContent = text;
      stateEl.className = isError ? "err" : "muted";
      retryBoxEl.style.display = isError ? "block" : "none";
    }

    function renderMaster(m) {
      const card = document.createElement("div");
      card.className = "card master-card";

      const photoWrap = document.createElement("div");
      photoWrap.className = "master-card-photo-wrap";
      if (m.photos && m.photos.length) {
        const photo = document.createElement("img");
        photo.className = "master-card-photo";
        photo.src = API_BASE.replace("/api/v1", "") + m.photos[0].url;
        photo.alt = m.full_name + " portfolio rasmi";
        photoWrap.appendChild(photo);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "master-card-photo-placeholder";
        placeholder.textContent = (m.full_name || "?").trim().charAt(0).toUpperCase();
        photoWrap.appendChild(placeholder);
      }

      if (isCustomer) {
        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = "fav-btn-overlay";
        const isFav = favoriteIds.has(m.id);
        favBtn.textContent = isFav ? "♥" : "♡";
        favBtn.setAttribute("aria-label", isFav ? "Sevimlilardan olib tashlash" : "Sevimlilarga qo'shish");
        favBtn.addEventListener("click", () => toggleFavorite(m.id, favBtn));
        photoWrap.appendChild(favBtn);
      }
      card.appendChild(photoWrap);

      const body = document.createElement("div");
      body.className = "master-card-body";

      const head = document.createElement("div");
      head.className = "card-row";
      const name = document.createElement("h3");
      name.textContent = m.full_name;
      const rating = document.createElement("span");
      if (m.rating_count > 0) {
        rating.className = "rating";
        rating.textContent = "★ " + m.rating_avg.toFixed(1) + " (" + m.rating_count + " sharh)";
      } else {
        rating.className = "badge";
        rating.textContent = "Yangi usta (0 sharh)";
      }
      head.append(name, rating);
      body.appendChild(head);

      const place = document.createElement("p");
      place.className = "muted master-card-location";
      place.textContent = m.city + ", " + m.district;
      const distKm = nearbyDistanceById.get(m.id);
      if (distKm != null) {
        place.textContent += " · ~" + (distKm < 10 ? distKm.toFixed(1) : Math.round(distKm)) + " km";
      }
      body.appendChild(place);

      if (m.schedule && m.schedule.length) {
        const todayWeekday = (new Date().getDay() + 6) % 7; // 0=Dushanba ... 6=Yakshanba
        const today = m.schedule.find((d) => d.weekday === todayWeekday);
        if (today) {
          const todayBadge = document.createElement("p");
          todayBadge.className = "master-card-today";
          if (today.is_working) {
            todayBadge.style.color = "var(--ok)";
            todayBadge.textContent = "Bugun ishlaydi (" + today.start_time + "–" + today.end_time + ")";
          } else {
            todayBadge.style.color = "var(--muted)";
            todayBadge.textContent = "Bugun dam olish kuni";
          }
          body.appendChild(todayBadge);
        }
      }

      if (m.bio) {
        const bio = document.createElement("p");
        bio.style.margin = "8px 0 0";
        bio.textContent = m.bio;
        body.appendChild(bio);
      }

      const services = m.services.slice().sort((a, b) =>
        (String(b.category_id) === categoryId) - (String(a.category_id) === categoryId));
      if (services.length) {
        const tagsWrap = document.createElement("div");
        tagsWrap.className = "service-tags";
        services.forEach((s) => {
          const tag = document.createElement("span");
          tag.className = "service-tag";
          const n = document.createElement("span");
          n.textContent = s.category_name;
          const p = document.createElement("span");
          p.className = "price";
          p.textContent = s.pricing_type === "fixed" && s.base_price != null
            ? formatSom(s.base_price) : "Narx kelishiladi";
          tag.append(n, document.createTextNode("·"), p);
          tagsWrap.appendChild(tag);
        });
        body.appendChild(tagsWrap);
      }

      const reviewsSection = document.createElement("div");
      reviewsSection.style.marginTop = "10px";

      const reviewsToggle = document.createElement("button");
      reviewsToggle.type = "button";
      reviewsToggle.className = "btn btn-outline";
      reviewsToggle.style.padding = "0 12px";
      reviewsToggle.style.fontSize = "0.85rem";
      reviewsToggle.textContent = "Sharhlar (" + m.rating_count + ") ▼";

      const reviewsList = document.createElement("div");
      reviewsList.style.display = "none";
      reviewsList.style.marginTop = "8px";
      reviewsList.style.padding = "8px 10px";
      reviewsList.style.background = "#f9fafb";
      reviewsList.style.border = "1px solid var(--border)";
      reviewsList.style.borderRadius = "8px";

      let reviewsLoaded = false;

      async function fetchReviews() {
        reviewsList.replaceChildren();
        const loadingP = document.createElement("p");
        loadingP.className = "muted";
        loadingP.style.margin = "4px 0";
        loadingP.textContent = "Sharhlar yuklanmoqda...";
        reviewsList.appendChild(loadingP);

        try {
          const res = await apiFetch("/masters/" + m.id + "/reviews");
          const items = res.reviews || res.items || [];
          reviewsList.replaceChildren();

          const subAvgParts = [];
          if (res.quality_avg != null) subAvgParts.push("Sifat: ★ " + res.quality_avg);
          if (res.timeliness_avg != null) subAvgParts.push("Vaqtida kelish: ★ " + res.timeliness_avg);
          if (res.price_avg != null) subAvgParts.push("Narx adolati: ★ " + res.price_avg);
          if (subAvgParts.length) {
            const avgP = document.createElement("p");
            avgP.className = "muted";
            avgP.style.margin = "0 0 8px";
            avgP.style.fontSize = "0.8rem";
            avgP.textContent = subAvgParts.join(" · ");
            reviewsList.appendChild(avgP);
          }

          if (!items.length) {
            const emptyP = document.createElement("p");
            emptyP.className = "muted";
            emptyP.style.margin = "4px 0";
            emptyP.textContent = "Hali sharh yo'q";
            reviewsList.appendChild(emptyP);
          } else {
            items.forEach((r) => {
              const rCard = document.createElement("div");
              rCard.style.padding = "6px 0";
              rCard.style.borderBottom = "1px solid var(--border)";

              const rHead = document.createElement("div");
              rHead.className = "card-row";
              rHead.style.fontSize = "0.85rem";

              const rAuthor = document.createElement("strong");
              rAuthor.textContent = r.customer_first_name;

              const rMeta = document.createElement("span");
              const rStars = document.createElement("span");
              rStars.className = "rating";
              rStars.textContent = "★ " + r.rating;
              rMeta.appendChild(rStars);

              if (r.created_at) {
                const rDate = document.createElement("span");
                rDate.className = "muted";
                rDate.style.marginLeft = "8px";
                rDate.textContent = formatDate(r.created_at);
                rMeta.appendChild(rDate);
              }

              rHead.append(rAuthor, rMeta);
              rCard.appendChild(rHead);

              if (r.comment) {
                const rComment = document.createElement("p");
                rComment.style.margin = "4px 0 0";
                rComment.style.fontSize = "0.85rem";
                rComment.textContent = r.comment;
                rCard.appendChild(rComment);
              }

              reviewsList.appendChild(rCard);
            });
          }
          reviewsLoaded = true;
        } catch (err) {
          reviewsList.replaceChildren();
          const errP = document.createElement("p");
          errP.className = "err";
          errP.style.margin = "0 0 8px";
          errP.textContent = "Xatolik: " + err.message;

          const revRetryBtn = document.createElement("button");
          revRetryBtn.type = "button";
          revRetryBtn.className = "btn btn-outline";
          revRetryBtn.textContent = "Qayta urinish";
          revRetryBtn.addEventListener("click", () => fetchReviews());

          reviewsList.append(errP, revRetryBtn);
        }
      }

      reviewsToggle.addEventListener("click", () => {
        if (reviewsList.style.display === "none") {
          reviewsList.style.display = "block";
          reviewsToggle.textContent = "Sharhlar ▲";
          if (!reviewsLoaded) {
            fetchReviews();
          }
        } else {
          reviewsList.style.display = "none";
          reviewsToggle.textContent = "Sharhlar (" + m.rating_count + ") ▼";
        }
      });

      reviewsSection.append(reviewsToggle, reviewsList);
      body.appendChild(reviewsSection);

      if (user && user.role === "customer") {
        const actions = document.createElement("div");
        actions.className = "master-card-actions";

        if (orderId) {
          const chooseBtn = document.createElement("button");
          chooseBtn.type = "button";
          chooseBtn.className = "btn btn-block btn-accent";
          chooseBtn.textContent = "Tanlash";
          chooseBtn.addEventListener("click", async () => {
            if (!(await confirmModal(m.full_name + " ustani ushbu buyurtma uchun tanlaysizmi?"))) return;
            chooseBtn.disabled = true;
            chooseBtn.textContent = "Tanlanmoqda...";
            try {
              await apiFetch("/orders/" + orderId + "/select-master", {
                method: "POST",
                body: JSON.stringify({ master_id: m.id }),
              });
              window.location.replace("my-orders.html");
            } catch (err) {
              toast(err.message, "error");
              chooseBtn.disabled = false;
              chooseBtn.textContent = "Tanlash";
            }
          });
          actions.appendChild(chooseBtn);
        } else {
          const orderBtn = document.createElement("a");
          orderBtn.className = "btn btn-block btn-accent";
          orderBtn.href = "create-order.html?master_id=" + encodeURIComponent(m.id);
          orderBtn.textContent = "Buyurtma berish";
          actions.appendChild(orderBtn);
        }

        body.appendChild(actions);
      }

      card.appendChild(body);
      return card;
    }

    async function load() {
      const showFavOnly = isCustomer && favOnly.checked;

      listEl.replaceChildren();
      searchBtn.disabled = true;
      retryBtnEl.disabled = true;
      setState("Yuklanmoqda...", false);
      try {
        await loadFavoriteIds();
        await loadNearbyDistances();

        let masters;
        if (showFavOnly) {
          masters = await apiFetch("/masters/favorites");
        } else {
          const qp = new URLSearchParams();
          if (categoryId) qp.set("category_id", categoryId);
          const city = form.city.value.trim();
          const district = form.district.value.trim();
          const nameQuery = form.q.value.trim();
          if (city) qp.set("city", city);
          if (district) qp.set("district", district);
          if (nameQuery) qp.set("q", nameQuery);
          masters = await apiFetch("/masters" + (qp.toString() ? "?" + qp : ""));
        }

        if (!masters.length) {
          setState("", false);
          const empty = document.createElement("div");
          empty.className = "card empty-state";
          empty.textContent = showFavOnly ? "Hali sevimli usta yo'q" : "Hozircha usta topilmadi";
          listEl.appendChild(empty);
          return;
        }
        setState("Topildi: " + masters.length + " ta usta", false);
        masters.forEach((m) => listEl.appendChild(renderMaster(m)));
      } catch (e) {
        setState("Xatolik: " + e.message, true);
      } finally {
        searchBtn.disabled = false;
        retryBtnEl.disabled = false;
      }
    }

    apiFetch("/categories").then((list) => {
      list.forEach((c) => {
        const o = document.createElement("option");
        o.value = c.id;
        o.textContent = c.name;
        categorySelect.appendChild(o);
      });
      if (categoryId) {
        categorySelect.value = categoryId;
        const c = list.find((x) => String(x.id) === categoryId);
        if (c) document.getElementById("title").textContent = c.name;
      }
    }).catch(() => {});

    categorySelect.addEventListener("change", () => {
      categoryId = categorySelect.value || null;
      document.getElementById("title").textContent = "Ustalar";
      load();
    });

    form.addEventListener("submit", (e) => { e.preventDefault(); load(); });
    load();
  </script>
</body>
</html>
