<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Profil - SmartUsta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>SmartUsta</a>
    <button id="headerLogoutBtn" class="btn btn-outline" type="button">Chiqish</button>
  </header>

  <main class="container">
    <h1>Profil</h1>

    <p id="state" class="muted" aria-live="polite">Yuklanmoqda...</p>
    <div id="retryBox" style="display: none; margin-bottom: 12px;">
      <button id="retryBtn" class="btn btn-outline" type="button">Qayta urinish</button>
    </div>

    <div id="profileCard" class="card" style="display: none;">
      <div class="profile-header">
        <div id="userAvatar" class="profile-avatar">M</div>
        <div>
          <strong id="userName" style="font-size: 1.2rem; display: block;"></strong>
          <span id="userRole" class="badge" style="margin-top: 4px;">Mijoz</span>
        </div>
      </div>

      <div class="profile-info-grid">
        <div class="profile-info-item">
          <span class="material-symbols-outlined" aria-hidden="true">call</span>
          <div>
            <span class="muted" style="font-size: 0.8rem; display: block;">Telefon raqami</span>
            <strong id="userPhone"></strong>
          </div>
        </div>
      </div>

      <a class="btn btn-outline btn-block" href="my-orders.html" style="margin-bottom: 10px;"><span class="material-symbols-outlined icon-sm" aria-hidden="true">receipt_long</span>Buyurtmalarim</a>
      <a class="btn btn-outline btn-block" href="complaints.html" style="margin-bottom: 10px;"><span class="material-symbols-outlined icon-sm" aria-hidden="true">report_problem</span>Shikoyatlar</a>
      <button id="logoutBtn" class="btn btn-danger btn-block" type="button"><span class="material-symbols-outlined icon-sm" aria-hidden="true">logout</span>Chiqish</button>
    </div>

    <!-- Parolni o'zgartirish formasi -->
    <form id="changePasswordForm" class="card" style="display: none; margin-top: 16px;" novalidate>
      <h2 style="margin-top: 0;">Parolni o'zgartirish</h2>

      <label for="currentPassword">Joriy parol</label>
      <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required />

      <label for="newPassword">Yangi parol (kamida 8 ta belgi, harf va raqam)</label>
      <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />

      <div id="passwordError" class="form-error" role="alert"></div>
      <div id="passwordSuccess" class="form-success" aria-live="polite"></div>

      <button id="changePasswordBtn" class="btn btn-block" type="submit" style="margin-top: 12px;">Parolni o'zgartirish</button>
    </form>
  </main>

  <nav class="bottom-nav"></nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const user = requireAuth(["customer"]);
      if (!user) return;

      renderNav("profile");

      const stateEl = document.getElementById("state");
      const retryBoxEl = document.getElementById("retryBox");
      const retryBtnEl = document.getElementById("retryBtn");
      const profileCardEl = document.getElementById("profileCard");
      const userAvatarEl = document.getElementById("userAvatar");
      const userNameEl = document.getElementById("userName");
      const userPhoneEl = document.getElementById("userPhone");
      const userRoleEl = document.getElementById("userRole");
      const changePasswordForm = document.getElementById("changePasswordForm");
      const passwordError = document.getElementById("passwordError");
      const passwordSuccess = document.getElementById("passwordSuccess");
      const changePasswordBtn = document.getElementById("changePasswordBtn");

      function fillUser(u) {
        userNameEl.textContent = u.full_name || "—";
        userAvatarEl.textContent = (u.full_name || "M").trim().charAt(0).toUpperCase();
        userPhoneEl.textContent = u.phone || "—";
        userRoleEl.textContent = formatRole(u.role || "customer");
      }

      async function loadProfile() {
        retryBoxEl.style.display = "none";
        retryBtnEl.disabled = true;
        stateEl.textContent = "Yuklanmoqda...";
        stateEl.className = "muted";

        fillUser(user);

        try {
          const fresh = await apiFetch("/auth/me");
          retryBtnEl.disabled = false;
          saveSession(getToken(), fresh);
          fillUser(fresh);
          stateEl.textContent = "";
          profileCardEl.style.display = "block";
          changePasswordForm.style.display = "block";
        } catch (err) {
          retryBtnEl.disabled = false;
          if (err.status === 403) {
            renderForbidden(err.message);
            return;
          }
          stateEl.textContent = "Xatolik: " + err.message;
          stateEl.className = "err";
          retryBoxEl.style.display = "block";
          profileCardEl.style.display = "block";
          changePasswordForm.style.display = "block";
        }
      }

      changePasswordForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        passwordError.textContent = "";
        passwordSuccess.textContent = "";
        const currentPassword = changePasswordForm.current_password.value;
        const newPassword = changePasswordForm.new_password.value;
        if (!currentPassword || !newPassword) {
          passwordError.textContent = "Joriy va yangi parolni kiriting";
          return;
        }
        if (newPassword.length < 8 || !/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) {
          passwordError.textContent = "Yangi parol kamida 8 ta belgidan iborat bo'lishi, harf va raqam qatnashishi kerak";
          return;
        }
        changePasswordBtn.disabled = true;
        changePasswordBtn.textContent = "Saqlanmoqda...";
        try {
          await apiFetch("/auth/change-password", {
            method: "POST",
            body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
          });
          changePasswordForm.reset();
          passwordSuccess.textContent = "Parol muvaffaqiyatli o'zgartirildi";
          toast("Parol yangilandi", "success");
        } catch (err) {
          passwordError.textContent = err.message;
        } finally {
          changePasswordBtn.disabled = false;
          changePasswordBtn.textContent = "Parolni o'zgartirish";
        }
      });

      retryBtnEl.addEventListener("click", () => loadProfile());
      document.getElementById("headerLogoutBtn").addEventListener("click", () => logout());
      document.getElementById("logoutBtn").addEventListener("click", () => logout());

      loadProfile();
    })();
  </script>
</body>
</html>
