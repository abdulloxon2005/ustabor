<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Parolni tiklash - UstaBor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>UstaBor</a>
  </header>

  <main class="container">
    <form id="form" class="card auth-card" novalidate>
      <div class="auth-icon-badge"><span class="material-symbols-outlined" aria-hidden="true">lock_reset</span></div>
      <h1>Parolni tiklash</h1>
      <p id="step-hint" class="muted">Telefon raqamingizni kiriting, sizga tasdiqlash kodi yuboriladi</p>

      <div id="phone-step">
        <label for="phone">Telefon raqami</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
               placeholder="+998 90 123 45 67" required />
      </div>

      <div id="reset-step" style="display:none;">
        <label for="otp_code">SMS orqali yuborilgan kod</label>
        <input id="otp_code" name="otp_code" type="text" inputmode="numeric"
               autocomplete="one-time-code" minlength="6" maxlength="6"
               pattern="\d{6}" placeholder="______" />

        <label for="new_password">Yangi parol (kamida 8 ta belgi, harf va raqam)</label>
        <input id="new_password" name="new_password" type="password"
               autocomplete="new-password" minlength="8" maxlength="72" />

        <p class="auth-switch" style="margin-top:8px;">
          <a href="#" id="back-link"><span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>Telefon raqamini o'zgartirish</a>
          ·
          <a href="#" id="resend-link">Kodni qayta yuborish</a>
        </p>
      </div>

      <div id="success-step" style="display:none;">
        <p class="form-success">Parolingiz muvaffaqiyatli tiklandi. Endi yangi parol bilan kirishingiz mumkin.</p>
      </div>

      <div id="error" class="form-error" role="alert"></div>

      <button id="submit" class="btn btn-block" type="submit">Kod yuborish</button>

      <p class="auth-switch"><a href="login.html"><span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>Kirishga qaytish</a></p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    if (getToken() && getUser()) {
      window.location.replace(homeFor(getUser()));
    }

    const form = document.getElementById("form");
    const submit = document.getElementById("submit");
    const errorEl = document.getElementById("error");
    const stepHintEl = document.getElementById("step-hint");
    const phoneStepEl = document.getElementById("phone-step");
    const resetStepEl = document.getElementById("reset-step");
    const successStepEl = document.getElementById("success-step");
    const otpInput = document.getElementById("otp_code");
    const backLink = document.getElementById("back-link");
    const resendLink = document.getElementById("resend-link");

    let step = "phone"; // "phone" | "reset" | "done"
    let phone = "";

    function showResetStep() {
      step = "reset";
      phoneStepEl.style.display = "none";
      resetStepEl.style.display = "block";
      stepHintEl.textContent = "Agar bu raqam ro'yxatdan o'tgan bo'lsa, tasdiqlash kodi yuborildi";
      submit.textContent = "Parolni tiklash";
      otpInput.value = "";
      otpInput.focus();
    }

    function showPhoneStep() {
      step = "phone";
      phoneStepEl.style.display = "block";
      resetStepEl.style.display = "none";
      stepHintEl.textContent = "Telefon raqamingizni kiriting, sizga tasdiqlash kodi yuboriladi";
      submit.textContent = "Kod yuborish";
      errorEl.textContent = "";
    }

    backLink.addEventListener("click", (e) => {
      e.preventDefault();
      showPhoneStep();
    });

    resendLink.addEventListener("click", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      try {
        await apiFetch("/auth/forgot-password/request-otp", {
          method: "POST",
          body: JSON.stringify({ phone }),
        });
        toast("Kod qayta yuborildi (agar raqam ro'yxatdan o'tgan bo'lsa)", "info");
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";

      if (step === "phone") {
        phone = form.phone.value.trim();
        if (!phone) {
          errorEl.textContent = "Telefon raqamini kiriting";
          return;
        }
        submit.disabled = true;
        submit.textContent = "Yuborilmoqda...";
        try {
          await apiFetch("/auth/forgot-password/request-otp", {
            method: "POST",
            body: JSON.stringify({ phone }),
          });
          showResetStep();
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submit.disabled = false;
        }
        return;
      }

      if (step === "reset") {
        const code = otpInput.value.trim();
        const newPassword = form.new_password.value;
        if (!/^\d{6}$/.test(code)) {
          errorEl.textContent = "Kod 6 ta raqamdan iborat bo'lishi kerak";
          return;
        }
        if (newPassword.length < 8) {
          errorEl.textContent = "Parol kamida 8 ta belgidan iborat bo'lishi kerak";
          return;
        }
        if (!/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) {
          errorEl.textContent = "Parolda kamida bitta harf va bitta raqam bo'lishi kerak";
          return;
        }
        submit.disabled = true;
        submit.textContent = "Tasdiqlanmoqda...";
        try {
          await apiFetch("/auth/forgot-password/confirm", {
            method: "POST",
            body: JSON.stringify({ phone, otp_code: code, new_password: newPassword }),
          });
          step = "done";
          resetStepEl.style.display = "none";
          successStepEl.style.display = "block";
          submit.style.display = "none";
          stepHintEl.textContent = "";
        } catch (err) {
          errorEl.textContent = err.message;
          submit.disabled = false;
          submit.textContent = "Parolni tiklash";
        }
      }
    });
  </script>
</body>
</html>
