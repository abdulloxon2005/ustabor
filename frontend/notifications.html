<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Bildirishnomalar - UstaBor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">handyman</span>UstaBor</a>
    <button id="mark-all-btn" class="btn btn-outline" type="button">Hammasini o'qilgan deb belgilash</button>
  </header>

  <main class="container">
    <h1>Bildirishnomalar</h1>
    <p id="state" class="muted" aria-live="polite">Yuklanmoqda...</p>
    <div id="retry-box" style="display:none; margin-bottom:12px;">
      <button id="retry-btn" class="btn btn-outline" type="button">Qayta urinish</button>
    </div>
    <div id="list"></div>
  </main>

  <nav class="bottom-nav"></nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const user = requireAuth(["customer", "master", "admin"]);
      if (!user) return;

      renderNav("notifications");

      const stateEl = document.getElementById("state");
      const retryBoxEl = document.getElementById("retry-box");
      const retryBtnEl = document.getElementById("retry-btn");
      const listEl = document.getElementById("list");
      const markAllBtn = document.getElementById("mark-all-btn");
      let takeableOrderIds = new Set();

      retryBtnEl.addEventListener("click", () => load());

      markAllBtn.addEventListener("click", async () => {
        markAllBtn.disabled = true;
        try {
          await apiFetch("/notifications/read-all", { method: "POST" });
          await load(true);
          await refreshNavBadge();
        } catch (err) {
          toast(err.message, "error");
        } finally {
          markAllBtn.disabled = false;
        }
      });

      function orderLink(n) {
        if (n.type === "new_dispute" && user.role === "admin") {
          const a = document.createElement("a");
          a.className = "btn btn-outline btn-block";
          a.style.marginTop = "8px";
          a.append(document.createTextNode("Shikoyatni ko'rish"), createIcon("arrow_forward", "icon-sm"));
          a.href = "admin.html?tab=disputes";
          return a;
        }
        if (n.type === "dispute_resolved" && (user.role === "customer" || user.role === "master")) {
          const a = document.createElement("a");
          a.className = "btn btn-outline btn-block";
          a.style.marginTop = "8px";
          a.append(document.createTextNode("Shikoyatlarni ko'rish"), createIcon("arrow_forward", "icon-sm"));
          a.href = "complaints.html";
          return a;
        }
        if (!n.related_order_id) return null;
        const a = document.createElement("a");
        a.className = "btn btn-outline btn-block";
        a.style.marginTop = "8px";
        // order-detail.html faqat mijoz uchun; usta/admin uchun tegishli
        // umumiy sahifaga (u yerda buyurtmani ro'yxatdan topadi) yo'naltiramiz.
        if (user.role === "customer") {
          a.append(document.createTextNode("Buyurtmani ko'rish"), createIcon("arrow_forward", "icon-sm"));
          a.href = "order-detail.html?id=" + encodeURIComponent(n.related_order_id);
        } else if (user.role === "master") {
          a.append(document.createTextNode("Usta panelida ko'rish"), createIcon("arrow_forward", "icon-sm"));
          a.href = "master-dashboard.html";
        } else {
          a.append(document.createTextNode("Admin panelida ko'rish"), createIcon("arrow_forward", "icon-sm"));
          a.href = "admin.html";
        }
        return a;
      }

      function renderNotification(n) {
        const card = document.createElement("div");
        card.className = "card";
        if (!n.is_read) {
          card.style.borderColor = "var(--primary)";
          card.style.background = "#eff6ff";
        }

        const row = document.createElement("div");
        row.className = "card-row";
        const title = document.createElement("strong");
        title.textContent = n.title;
        row.appendChild(title);
        if (!n.is_read) {
          const dot = document.createElement("span");
          dot.className = "badge";
          dot.style.background = "var(--primary)";
          dot.style.color = "#fff";
          dot.textContent = "Yangi";
          row.appendChild(dot);
        }
        card.appendChild(row);

        const body = document.createElement("p");
        body.style.margin = "6px 0 0";
        body.textContent = n.body;
        card.appendChild(body);

        const meta = document.createElement("p");
        meta.className = "muted";
        meta.style.margin = "4px 0 0";
        meta.textContent = formatDate(n.created_at);
        card.appendChild(meta);

        // Usta uchun: yangi (ochiq) taklifni shu yerdan, bitta tugma bilan olish —
        // faqat hali HAQIQATDA faol (muddati o'tmagan, boshqa usta olib ulgurmagan) bo'lsa.
        if (
          user.role === "master" &&
          n.type === "new_offer" &&
          n.related_order_id &&
          takeableOrderIds.has(n.related_order_id)
        ) {
          const takeBtn = document.createElement("button");
          takeBtn.type = "button";
          takeBtn.className = "btn btn-accent btn-block";
          takeBtn.style.marginTop = "8px";
          takeBtn.textContent = "Buyurtmani olish";
          takeBtn.addEventListener("click", async () => {
            takeBtn.disabled = true;
            takeBtn.textContent = "Olinmoqda...";
            try {
              await apiFetch("/orders/" + n.related_order_id + "/accept", { method: "POST" });
              toast("Buyurtma sizga rasmiylashtirildi", "success");
              await load(true);
              await refreshNavBadge();
            } catch (err) {
              toast(err.message, "error");
              takeBtn.disabled = false;
              takeBtn.textContent = "Buyurtmani olish";
            }
          });
          card.appendChild(takeBtn);
        }

        const link = orderLink(n);
        if (link) card.appendChild(link);

        if (!n.is_read) {
          const readBtn = document.createElement("button");
          readBtn.type = "button";
          readBtn.className = "btn btn-outline btn-block";
          readBtn.style.marginTop = "8px";
          readBtn.textContent = "O'qilgan deb belgilash";
          readBtn.addEventListener("click", async () => {
            readBtn.disabled = true;
            try {
              await apiFetch("/notifications/" + n.id + "/read", { method: "POST" });
              await load(true);
              await refreshNavBadge();
            } catch (err) {
              toast(err.message, "error");
              readBtn.disabled = false;
            }
          });
          card.appendChild(readBtn);
        }

        return card;
      }

      async function load(silent) {
        if (!silent) {
          listEl.replaceChildren();
          retryBoxEl.style.display = "none";
          retryBtnEl.disabled = true;
          stateEl.textContent = "Yuklanmoqda...";
          stateEl.className = "muted";
        }
        try {
          const requests = [apiFetch("/notifications")];
          if (user.role === "master") {
            requests.push(
              apiFetch("/masters/me/orders").catch(() => ({ pending_offers: [] }))
            );
          }
          const [items, ordersData] = await Promise.all(requests);
          takeableOrderIds = new Set(
            (ordersData ? ordersData.pending_offers : []).map((o) => o.order_id)
          );
          retryBtnEl.disabled = false;
          retryBoxEl.style.display = "none";
          listEl.replaceChildren();
          if (!items.length) {
            stateEl.textContent = "";
            const empty = document.createElement("div");
            empty.className = "card empty-state";
            empty.textContent = "Hali bildirishnoma yo'q";
            listEl.appendChild(empty);
            return;
          }
          stateEl.textContent = "";
          items.forEach((n) => listEl.appendChild(renderNotification(n)));
        } catch (e) {
          if (silent) return;
          retryBtnEl.disabled = false;
          if (e.status === 403) {
            renderForbidden(e.message);
            return;
          }
          stateEl.textContent = "Xatolik: " + e.message;
          stateEl.className = "err";
          retryBoxEl.style.display = "block";
        }
      }

      load();
      startPolling(() => load(true), 15000);
    })();
  </script>
</body>
</html>
